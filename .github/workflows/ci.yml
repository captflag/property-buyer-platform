name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the in-flight run: there is no value in
# finishing a check against code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # The build runs without Supabase on purpose: demo mode is a
          # supported configuration, and CI is where a regression that breaks
          # it would otherwise go unnoticed.
          NEXT_TELEMETRY_DISABLED: 1

  migrations:
    name: Verify migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Apply schema migrations in order
        # Storage and RLS migrations reference Supabase-managed schemas that a
        # bare Postgres does not have, so this checks the core schema and its
        # functions -- enough to catch a syntax error or a broken reference
        # before it reaches a real database.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d verify -v ON_ERROR_STOP=1 \
            -c "create schema if not exists auth;" \
            -c "create table if not exists auth.users (id uuid primary key, email text, raw_user_meta_data jsonb);" \
            -c "create or replace function auth.uid() returns uuid language sql stable as \$\$ select null::uuid \$\$;"
          psql -h localhost -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260101000000_initial_schema.sql
          psql -h localhost -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260101000100_functions_and_triggers.sql
